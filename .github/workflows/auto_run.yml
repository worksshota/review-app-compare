name: Compare Review Auto Post

on:
  workflow_dispatch: # 手動実行用
  schedule:
    - cron: '0 0 * * *' # 毎日日本時間9:00に自動実行

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v3

      - name: Pythonをセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests markdown

      - name: スクリプトを実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HATENA_ID: ${{ secrets.HATENA_ID }}
          HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
        run: python main.py

      - name: 変更をコミットしてプッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add products.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update products.txt [skip ci]" && git push)
